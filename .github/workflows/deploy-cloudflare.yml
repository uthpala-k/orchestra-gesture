name: Deploy Orchestra Gesture

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install archive extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y unar

      - name: Download VSCO orchestra samples
        run: |
          curl -L "https://s3.amazonaws.com/VersilianStudios/256OrchestralSamples.rar" \
            -o /tmp/vsco.rar

          mkdir -p /tmp/vsco

          unar -quiet \
            -output-directory /tmp/vsco \
            /tmp/vsco.rar

      - name: Import orchestra samples
        run: |
          node tools/import-vsco256.mjs "/tmp/vsco"

      - name: Install solo samples
        run: npm run install:solo-samples

      - name: Build website
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=orchestra-gesture --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}